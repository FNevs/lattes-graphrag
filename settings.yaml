### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## There are a number of settings to tune the threading and token limits for LLM calls - check the docs.

completion_models:
  default_completion_model:
    model_provider: azure
    model: gpt-4.1-mini
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    deployment_name: gpt-4.1-mini
    api_base: https://lattes-graphrag-tcc.openai.azure.com
    api_version: "2025-01-01-preview"
    # Sem rate_limit, o graphrag dispara requisicoes em paralelo sem freio e estoura o
    # TPM do deployment: foi o que abortou o V2 em 21/09/2026 (337 RateLimitError,
    # 9,08 dolares gastos sem grafo). A janela deslizante mantem o consumo sob a cota.
    # Deployment com 1000 unidades desde 21/09 (1M tokens e 1000 requisicoes por
    # minuto); o limite abaixo usa 80% disso como folga.
    rate_limit:
      type: sliding_window
      period_in_seconds: 60
      tokens_per_period: 800000
      requests_per_period: 800
    retry:
      type: exponential_backoff
      max_retries: 10

embedding_models:
  default_embedding_model:
    model_provider: azure
    model: text-embedding-3-small
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    deployment_name: text-embedding-3-small
    api_base: https://lattes-graphrag-tcc.openai.azure.com
    api_version: "2023-05-15"
    dimensions: 1536
    retry:
      type: exponential_backoff
      # O deployment GlobalStandard de embeddings responde 404 DeploymentNotFound
      # em ~1 de cada 25 requisicoes paralelas (um servidor do pool global sem o
      # deployment; testado em 18/09/2026). O graphrag_llm nao tenta de novo em
      # NotFoundError e aborta o pipeline inteiro. Esta e a lista padrao de
      # graphrag_llm/retry/exceptions_to_skip.py SEM o NotFoundError.
      max_retries: 7
      exceptions_to_skip:
        - BadRequestError
        - UnsupportedParamsError
        - ContextWindowExceededError
        - ContentPolicyViolationError
        - ImageFetchError
        - InvalidRequestError
        - AuthenticationError
        - PermissionDeniedError
        - UnprocessableEntityError
        - APIConnectionError
        - APIError
        - ServiceUnavailableError
        - APIResponseValidationError
        - BudgetExceededError

### Document processing settings ###

input:
  type: text # [csv, text, json, jsonl]

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base
  # O title do documento e o nome do arquivo ("<titular> - <id lattes>.txt"). Repetir
  # isso no topo de cada chunk diz de quem e o curriculo; sem isso, um chunk do meio do
  # arquivo nao sabe (critico com varios curriculos no mesmo indice).
  prepend_metadata:
    - title

# Para uma execucao diagnostica (so o grafo, sem relatorios de comunidade nem
# embeddings), descomentar o bloco abaixo -- foi o que o passo 2c usou.
# O V2 rodou em duas etapas (21/09): primeiro a lista acima (grafo), depois
# [create_community_reports, generate_text_embeddings] sobre o output ja gravado.
# workflows:
#   - create_community_reports
#   - generate_text_embeddings

### Storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

input_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "input"

output_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"

reporting:
  type: file # [file, blob]
  base_dir: "logs"

cache:
  type: json # [json, memory, none]
  storage:
    type: file # [file, blob, cosmosdb]
    base_dir: "cache"
    
vector_store:
  type: lancedb
  db_uri: "output/lancedb"
  vector_size: 1536

### Workflow settings ###

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/lattes/extract_graph.txt"
  entity_types: [person,organization,geo,event,publication,software,project,knowledge_area,course]
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/lattes/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/lattes/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: true # to save the graph in graphml format and false to save the graph in json format
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
